name: auto-arr

networks:
  arr:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

# Images are pinned to the versions this stack was verified with, so an upstream
# release cannot change behaviour underneath you (Jellyfin 12 did exactly that).
# To update: bump the tags below, then re-run ./setup.sh (pulls and re-wires).
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:version-5.2.3_v2.0.14
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: "8080"
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${QBIT_PORT}:8080"
    networks: [arr]
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:version-2.5.2.5491
    container_name: prowlarr
    environment:
      <<: *common-env
      PROWLARR__AUTH__APIKEY: ${PROWLARR_API_KEY}
      PROWLARR__AUTH__METHOD: Forms
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    networks: [arr]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:version-6.3.0.10514
    container_name: radarr
    environment:
      <<: *common-env
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY}
      RADARR__AUTH__METHOD: Forms
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${RADARR_PORT}:7878"
    networks: [arr]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:version-4.0.19.2979
    container_name: sonarr
    environment:
      <<: *common-env
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY}
      SONARR__AUTH__METHOD: Forms
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${SONARR_PORT}:8989"
    networks: [arr]
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:version-12.0ubu2604
    container_name: jellyfin
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media
    ports:
      - "${JELLYFIN_PORT}:8096"
    networks: [arr]
    restart: unless-stopped

  jellyseerr:
    # Jellyseerr was renamed Seerr. fallenbagel/jellyseerr:latest is frozen at
    # 2.7.3 (Aug 2025), which still talks to Jellyfin with the legacy
    # X-Emby-Authorization header that Jellyfin 12 rejects by default.
    image: seerr/seerr:v3.4.1
    container_name: jellyseerr
    init: true               # the Seerr image ships no init process
    user: "${PUID}:${PGID}"  # image defaults to UID 1000; match the stack so /app/config is writable
    environment:
      TZ: ${TZ}
    volumes:
      - ${CONFIG_ROOT}/jellyseerr:/app/config
    ports:
      - "${JELLYSEERR_PORT}:5055"
    networks: [arr]
    restart: unless-stopped

  flaresolverr:
    # Solves Cloudflare challenges for Prowlarr indexers that otherwise fail
    # with "blocked by CloudFlare Protection" (e.g. 1337x). Internal only:
    # Prowlarr reaches it on the compose network, and only routes indexers
    # tagged 'flaresolverr' through it (see README).
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    environment:
      TZ: ${TZ}
    networks: [arr]
    restart: unless-stopped

  homepage:
    # One dashboard for everything. Its config is written by the bootstrap
    # (which holds all the API keys); Homepage reloads it on change.
    image: ghcr.io/gethomepage/homepage:v2.3.0
    container_name: homepage
    environment:
      <<: *common-env
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-*}
    volumes:
      - ${CONFIG_ROOT}/homepage:/app/config
      - ${DATA_ROOT}:/data:ro
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"
    networks: [arr]
    restart: unless-stopped

  bootstrap:
    image: alpine:3.20
    container_name: arr-bootstrap
    depends_on:
      - qbittorrent
      - prowlarr
      - radarr
      - sonarr
      - jellyfin
      - jellyseerr
      - flaresolverr
      - homepage
    environment:
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      ARR_ADMIN_USER: ${ARR_ADMIN_USER}
      ARR_ADMIN_PASSWORD: ${ARR_ADMIN_PASSWORD}
      QBIT_USER: ${QBIT_USER}
      QBIT_PASSWORD: ${QBIT_PASSWORD}
      JELLYFIN_ADMIN_USER: ${JELLYFIN_ADMIN_USER}
      JELLYFIN_ADMIN_PASSWORD: ${JELLYFIN_ADMIN_PASSWORD}
      SEED_RATIO: ${SEED_RATIO:-1.0}
      SEED_TIME_MINUTES: ${SEED_TIME_MINUTES:-1440}
      LAN_LOGIN: ${LAN_LOGIN:-skip}
      QUALITY_PROFILE: ${QUALITY_PROFILE:-HD-1080p}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      HOMEPAGE_PORT: ${HOMEPAGE_PORT:-3000}
      JELLYFIN_PORT: ${JELLYFIN_PORT}
      JELLYSEERR_PORT: ${JELLYSEERR_PORT}
      RADARR_PORT: ${RADARR_PORT}
      SONARR_PORT: ${SONARR_PORT}
      PROWLARR_PORT: ${PROWLARR_PORT}
      QBIT_PORT: ${QBIT_PORT}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ./bootstrap:/bootstrap:ro
      - ${CONFIG_ROOT}/homepage:/homepage
    networks: [arr]
    restart: "no"
    # apk fetch can hit a transient DNS/network blip right after a restart; retry.
    entrypoint: ["/bin/sh", "-c", "for i in 1 2 3 4 5 6; do apk add --no-cache bash curl jq >/dev/null && break; echo \"apk fetch failed (attempt $i), retrying...\"; sleep 10; done; exec bash /bootstrap/bootstrap.sh"]
